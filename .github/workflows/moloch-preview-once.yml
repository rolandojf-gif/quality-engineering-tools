name: Create MOLOCH.SH video preview (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/moloch-preview-once.yml']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture real MOLOCH.SH pages and encode preview
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium)"
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p /tmp/moloch-screens assets/video
          for view in hoy modelos carrera ai2027; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --window-size=1280,800 --virtual-time-budget=13000 \
              --screenshot="/tmp/moloch-screens/${view}.png" \
              "https://moloch-sh.netlify.app/?lang=en#${view}" 2>/dev/null
            test -s "/tmp/moloch-screens/${view}.png"
          done
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -t 3.2 -i /tmp/moloch-screens/hoy.png \
            -loop 1 -t 3.2 -i /tmp/moloch-screens/modelos.png \
            -loop 1 -t 3.2 -i /tmp/moloch-screens/carrera.png \
            -loop 1 -t 3.2 -i /tmp/moloch-screens/ai2027.png \
            -filter_complex "[0:v]fps=30,scale=1280:800:force_original_aspect_ratio=increase,crop=1280:800,format=yuv420p[a];[1:v]fps=30,scale=1280:800:force_original_aspect_ratio=increase,crop=1280:800,format=yuv420p[b];[2:v]fps=30,scale=1280:800:force_original_aspect_ratio=increase,crop=1280:800,format=yuv420p[c];[3:v]fps=30,scale=1280:800:force_original_aspect_ratio=increase,crop=1280:800,format=yuv420p[d];[a][b]xfade=transition=fade:duration=0.55:offset=2.65[x1];[x1][c]xfade=transition=fade:duration=0.55:offset=5.3[x2];[x2][d]xfade=transition=fade:duration=0.55:offset=7.95[v]" \
            -map "[v]" -t 11.15 -c:v libx264 -preset veryfast -crf 26 \
            -pix_fmt yuv420p -movflags +faststart assets/video/moloch-sh-preview.mp4
          test "$(stat -c%s assets/video/moloch-sh-preview.mp4)" -gt 40000
      - name: Connect video to Other Projects and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          s = page.read_text()
          anchor = '<h3 class="other-project__title"><a class="other-project__link" href="https://moloch-sh.netlify.app/"'
          p = s.find(anchor)
          assert p >= 0, 'MOLOCH card not found'
          end = s.find('</li>', p)
          part = s[p:end]
          assert 'moloch-sh-preview.mp4' not in part, 'Preview already added'
          needle = '              </span>\n            </div>\n          </figure>'
          assert needle in part, 'Media frame structure changed'
          video = '''              </span>
              <video class="media-frame__video" muted loop playsinline preload="metadata" aria-hidden="true">
                <source src="assets/video/moloch-sh-preview.mp4" type="video/mp4">
              </video>
            </div>
          </figure>'''
          part = part.replace(needle, video, 1)
          s = s[:p] + part + s[end:]
          page.write_text(s)
          PY
          git config user.name 'moloch-preview-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/video/moloch-sh-preview.mp4
          git commit -m "Show authentic MOLOCH.SH video in Other Projects"
          git pull --rebase
          git push
